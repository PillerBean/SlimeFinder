name: tree2-checks

on:
  push:
    paths:
      - "SlimeFinder-Tree-2.0/**"
  pull_request:
    paths:
      - "SlimeFinder-Tree-2.0/**"

jobs:
  structure-and-catalog:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SlimeFinder-Tree-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure check
        run: python scripts/qa/check_tree.py
      - name: UI text catalog check
        run: python scripts/qa/check_ui_text.py
