<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缓存页 UI 方案</title>
<link rel="stylesheet" href="cache-ui.css">
<style>
  .index { width: 1080px; max-width: calc(100vw - 32px); margin: 28px auto; }
  .index h1 { margin: 0 0 4px; }
  .index .lead { color: var(--muted); margin: 0 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card a { color: inherit; text-decoration: none; display: block; }
  .card .preview { height: 130px; border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; background: var(--green-50); padding: 14px; }
  .mini { background: #fff; border: 1px solid var(--line); border-radius: 8px; height: 100%; padding: 10px; }
  .mini .b { height: 9px; background: #dcebdc; border-radius: 4px; margin-bottom: 7px; }
  .mini .b.g { width: 74%; background: #c9e2cb; }
  .mini .b.s { width: 48%; }
  .mini .btnmini { height: 18px; width: 64px; border-radius: 5px; background: var(--green-700); margin-top: 8px; }
  .card .body { padding: 12px 14px 14px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--green-700); }
  .note { margin-top: 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="index">
  <h1>缓存页 UI 方案</h1>
  <p class="lead">三个布局方向，均使用同一套缓存功能语义；点击卡片打开可交互原型。</p>
  <div class="cards">
    <div class="card">
      <a href="scheme-a.html">
        <div class="preview"><div class="mini"><div class="b g"></div><div class="b"></div><div class="b s"></div><div class="btnmini"></div></div></div>
        <div class="body"><h2>A · 下载优先三段式</h2><p>下载区 → 本地构建 → 缓存包列表，纵向阅读最直接。</p><span class="badge">推荐：信息层级最清楚</span></div>
      </a>
    </div>
    <div class="card">
      <a href="scheme-b.html">
        <div class="preview"><div class="mini" style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div><div class="b g"></div><div class="b"></div></div><div><div class="b"></div><div class="b"></div><div class="b s"></div></div></div></div>
        <div class="body"><h2>B · 左右工作台</h2><p>左侧下载与构建，右侧缓存库；适合大屏和频繁操作。</p><span class="badge">推荐：桌面宽屏</span></div>
      </a>
    </div>
    <div class="card">
      <a href="scheme-c.html">
        <div class="preview"><div class="mini"><div style="display:flex;gap:5px"><div class="b" style="flex:1"></div><div class="b" style="flex:1"></div><div class="b" style="flex:1"></div></div><div class="b g"></div><div class="btnmini"></div></div></div>
        <div class="body"><h2>C · 下载入口 + 构建步骤</h2><p>强化下载入口，本地构建拆成三步，适合新用户。</p><span class="badge">推荐：引导性更强</span></div>
      </a>
    </div>
  </div>
  <p class="note">说明：原型仅用于排版/交互评审，数据为示例；构建按钮在填写有效范围和预算后启用。当前应用问题“构建按钮不可用”需与原型一起修正。</p>
</div>
</body>
</html>
